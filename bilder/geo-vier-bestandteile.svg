<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="titel beschreibung">
<title id="titel">Die vier Bestandteile von GEO</title>
<desc id="beschreibung">Vier gleichrangige Säulen der Generative Engine Optimization: Entitätenaufbau, strukturierte Daten, zitierfähige Inhalte und Messung der KI-Sichtbarkeit. Wer nur einen Teil bearbeitet, macht kein GEO.</desc>
<rect width="880" height="300" fill="#ffffff"/>
<text x="24" y="38" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#072328">Die vier Bestandteile von GEO</text>
<text x="24" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#5a6b6e">Alle vier gehören zusammen. Wer nur einen bearbeitet, macht kein GEO.</text>
<rect x="24" y="82" width="196" height="150" rx="8" fill="#fdf1e4" stroke="#ED8924" stroke-width="2"/>
<circle cx="52" cy="112" r="15" fill="#ED8924"/>
<text x="52" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1</text>
<text x="78" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#072328">Entität</text>
<text x="44" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">Das Unternehmen als</text>
<text x="44" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">eigenständige, wieder-</text>
<text x="44" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">erkennbare Einheit,</text>
<text x="44" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">nicht als Seitenhaufen.</text>
<rect x="238" y="82" width="196" height="150" rx="8" fill="#fdf1e4" stroke="#ED8924" stroke-width="2"/>
<circle cx="266" cy="112" r="15" fill="#ED8924"/>
<text x="266" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">2</text>
<text x="292" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#072328">Strukturierte Daten</text>
<text x="258" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">JSON-LD mit sauberen</text>
<text x="258" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">@id-Referenzen statt</text>
<text x="258" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">isolierter Blöcke auf</text>
<text x="258" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">jeder Seite.</text>
<rect x="452" y="82" width="196" height="150" rx="8" fill="#fdf1e4" stroke="#ED8924" stroke-width="2"/>
<circle cx="480" cy="112" r="15" fill="#ED8924"/>
<text x="480" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">3</text>
<text x="506" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#072328">Zitierfähigkeit</text>
<text x="472" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">Abschnitte, die für sich</text>
<text x="472" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">stehen. Die Aussage</text>
<text x="472" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">zuerst, der Einschub</text>
<text x="472" y="202" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">danach.</text>
<rect x="666" y="82" width="190" height="150" rx="8" fill="#fdf1e4" stroke="#ED8924" stroke-width="2"/>
<circle cx="694" cy="112" r="15" fill="#ED8924"/>
<text x="694" y="118" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">4</text>
<text x="720" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#072328">Messung</text>
<text x="686" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">Über mehrere Systeme,</text>
<text x="686" y="166" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">mehrfach, mit Blick auf</text>
<text x="686" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#072328">die Quellenziehung.</text>
<rect x="24" y="252" width="832" height="32" rx="6" fill="#072328"/>
<text x="40" y="273" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff">GEO ersetzt SEO nicht. Eine Seite, die nicht rankt, wird auch nicht zitiert.</text>
<text x="856" y="273" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#ED8924">taismo.de</text>
</svg>
